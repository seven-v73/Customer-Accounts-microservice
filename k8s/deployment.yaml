apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-accounts
spec:
  replicas: 2
  selector:
    matchLabels: {app: customer-accounts}
  template:
    metadata: {labels: {app: customer-accounts}}
    spec:
      containers:
        - name: customer-accounts
          image: customer-accounts:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: customer-accounts
spec:
  selector: {app: customer-accounts}
  ports: [{port: 8080, targetPort: 8080}]
  type: ClusterIP

