[nosetests]
verbosity=2
with-coverage=1
cover-package=service
cover-inclusive=1
cover-erase=1
cover-tests=1
cover-min-percentage=80

[coverage:run]
branch = True
source = service

[coverage:report]
show_missing = True
skip_covered = False
fail_under = 80

[flake8]
max-line-length = 100
exclude = .git,__pycache__,.venv
statistics = True
show-source = True

[pylint]
load-plugins =
reports = no
score = yes

[pylint.messages control]
disable = C0114,C0116,R0903

